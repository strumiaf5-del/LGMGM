[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["__pycache__", ".venv", "uploads", "reference_library"]

[tool.ruff.lint]
# Empezar con checks conservadores (no romper el código existente)
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort
]
ignore = [
    "E501",  # line too long (lo manejamos a mano)
    "E402",  # module level import not at top (muchos imports post-app en el código)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports en tests (fixtures)
"app.py" = ["F401"]  # FIX ruff F401: app.py importa módulos que se inyectan a los
                    # routers vía `_audio_router_dependencies = dict(globals())`.
                    # Los imports NO se usan dentro de app.py pero son necesarios
                    # para que estén en el namespace y se pasen a los routers.
                    # Verificado: ningún import listado se usa directamente en app.py.
