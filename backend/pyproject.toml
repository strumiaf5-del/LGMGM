[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["__pycache__", ".venv", "uploads", "reference_library"]

[tool.ruff.lint]
# Empezar con checks conservadores (no romper el código existente)
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "I",    # isort
]
ignore = [
    "E501",  # line too long (lo manejamos a mano)
    "E402",  # module level import not at top (muchos imports post-app en el código)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # unused imports en tests (fixtures)
